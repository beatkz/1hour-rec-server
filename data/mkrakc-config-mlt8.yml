epg:
  cache-dir: /var/lib/mirakc/epg

server:
  addrs:
    - http: '0.0.0.0:40772'
  mounts:
    /miraview:
      path: /var/www/miraview
      index: index.html

tuners:
  - name: PX_MLT1
    types: [GR, BS, CS]
    command: recpt1 --device /dev/pxmlt8video0 --lnb 15 {{{channel}}} - -

  - name: PX_MLT2
    types: [GR, BS, CS]
    command: recpt1 --device /dev/pxmlt8video1 --lnb 15 {{{channel}}} - -

  - name: PX_MLT3
    types: [GR, BS, CS]
    command: recpt1 --device /dev/pxmlt8video2 --lnb 15 {{{channel}}} - -

  - name: PX_MLT4
    types: [GR, BS, CS]
    command: recpt1 --device /dev/pxmlt8video3 --lnb 15 {{{channel}}} - -
    
  - name: PX_MLT5
    types: [GR, BS, CS]
    command: recpt1 --device /dev/pxmlt8video4 --lnb 15 {{{channel}}} - -

  - name: PX_MLT6
    types: [GR, BS, CS]
    command: recpt1 --device /dev/pxmlt8video5 --lnb 15 {{{channel}}} - -

  - name: PX_MLT7
    types: [GR, BS, CS]
    command: recpt1 --device /dev/pxmlt8video6 --lnb 15 {{{channel}}} - -

  - name: PX_MLT8
    types: [GR, BS, CS]
    command: recpt1 --device /dev/pxmlt8video7 --lnb 15 {{{channel}}} - -
filters:
  # Chinachu/Mirakurunの設定例より
  #
  # tsukumijima/libaribb25を使用する場合は，`arib-b25-stream-test -v 0`とログを
  # 制限する必要があります．これはSTDERRへの出力で`\r`が使用されており，これが原
  # 因でログのライン分割処理で問題が発生するためです．
  decode-filter:
    command: >-
      arib-b25-stream-test
