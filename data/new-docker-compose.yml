services:
    mirakc:
        container_name: mirakc
        image: docker.io/mirakc/mirakc:alpine
        init: true
        restart: unless-stopped
        devices:
        # Add device files used in `tuners[].command`.
            - /dev/px4video0:/dev/px4video0
            - /dev/px4video1:/dev/px4video1
            - /dev/px4video2:/dev/px4video2
            - /dev/px4video3:/dev/px4video3
            - /dev/px4video4:/dev/px4video4
            - /dev/px4video5:/dev/px4video5
            - /dev/px4video6:/dev/px4video6
            - /dev/px4video7:/dev/px4video7
            - /dev/bus:/dev/bus
        ports:
            - 40772:40772
        volumes:
            - mirakc-epg:/var/lib/mirakc/epg
            - ./mirakc/config.yml:/etc/mirakc/config.yml:ro
        environment:
        TZ: Asia/Tokyo
        RUST_LOG: info
    
    miraview:
        image: docker.io/mirakc/mirakc:alpine
        container_name: miraview-loader
        restart: "no"
        volumes:
            - miraview-html:/var/www/miraview
        working_dir: /var/www/miraview
        environment:
            MIRAVIEW_VERSION: v0.1.2    # ここのバージョンは適宜変更
        entrypoint: ash
        command: -c "curl -L https://github.com/maeda577/miraview/releases/download/$$MIRAVIEW_VERSION/build.tar.gz | tar -zxvf -"

    mysql:
        container_name: mysql-epgstation-v3
        image: mariadb:12.3
        volumes:
            - mysql-db:/var/lib/mysql
        environment:
            MYSQL_USER: epgstation
            MYSQL_PASSWORD: epgstation
            MYSQL_ROOT_PASSWORD: epgstation
            MYSQL_DATABASE: epgstation
            TZ: "Asia/Tokyo"
        command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --performance-schema=false --binlog_expire_logs_seconds=86400 # for mariadb
        restart: always
        logging:
            options:
                max-size: "10m"
                max-file: "3"

    epgstation:
        container_name: epgstation-v3
        build:
            context: "./epgstation"
            dockerfile: "debian.Dockerfile"
        volumes:
            - /etc/localtime:/etc/localtime:ro
            - ./epgstation/config:/app/config
            - ./epgstation/data:/app/data
            - ./epgstation/thumbnail:/app/thumbnail
            - ./epgstation/logs:/app/logs
            - ./recorded:/app/recorded
        environment:
            TZ: "Asia/Tokyo"
        depends_on:
            - mirakc
            - mysql
        ports:
            - "8888:8888"
            - "8889:8889"
        user: "1000:1000"
        restart: always

volumes:
    mysql-db:
        driver: local
    mirakc-epg:
        name: mirakc_epg
        driver: local
    miraview-html:
        name: miraview_html
        driver: local
