epg:
  cache-dir: /var/lib/mirakc/epg

server:
  addrs:
    - http: '0.0.0.0:40772'
  mounts:
    /miraview:
      path: /var/www/miraview
      index: index.html

tuners:
  - name: PX_S1
    types: [BS, CS]
    command: recpt1 --lnb 15 --device /dev/px4video0 {{{channel}}} - -

  - name: PX_S2
    types: [BS, CS]
    command: recpt1 --lnb 15 --device /dev/px4video1 {{{channel}}} - -

  - name: PX_T1
    types: [GR]
    command: recpt1 --device /dev/px4video2 {{{channel}}} - -

  - name: PX_T2
    types: [GR]
    command: recpt1 --device /dev/px4video3 {{{channel}}} - -
filters:
  # Chinachu/Mirakurunの設定例より
  #
  # tsukumijima/libaribb25を使用する場合は，`arib-b25-stream-test -v 0`とログを
  # 制限する必要があります．これはSTDERRへの出力で`\r`が使用されており，これが原
  # 因でログのライン分割処理で問題が発生するためです．
  decode-filter:
    command: >-
      arib-b25-stream-test
